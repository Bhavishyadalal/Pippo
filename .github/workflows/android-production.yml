name: Android Production APK
run-name: Pippo ${{ inputs.build_mode }} · ${{ inputs.architecture }} · ${{ inputs.service_variant }}

on:
  workflow_call:
    inputs:
      build_mode:
        type: string
        default: development
      architecture:
        type: string
        default: arm64
      service_variant:
        type: string
        default: foss
  workflow_dispatch:
    inputs:
      build_mode:
        description: Production requires signing secrets; development installs alongside Pippo
        type: choice
        options: [production, development]
        default: production
      architecture:
        description: arm64 suits most current phones; universal supports all included ABIs
        type: choice
        options: [arm64, universal]
        default: arm64
      service_variant:
        description: FOSS includes standalone casting; GMS uses Google Play Services Cast
        type: choice
        options: [foss, gms]
        default: foss

permissions:
  contents: read

concurrency:
  group: pippo-apk-${{ github.ref }}-${{ inputs.build_mode }}-${{ inputs.architecture }}-${{ inputs.service_variant }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_MODE: ${{ inputs.build_mode }}
      ARCHITECTURE: ${{ inputs.architecture }}
      SERVICE_VARIANT: ${{ inputs.service_variant }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
      LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || secrets.DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Pippo identity
        run: python3 scripts/check_pippo_branding.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Prepare production signing
        if: inputs.build_mode == 'production'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Add the four production signing secrets described in BUILDING.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pippo-release.jks"
          echo "PIPPO_KEYSTORE_PATH=$RUNNER_TEMP/pippo-release.jks" >> "$GITHUB_ENV"
      - name: Build and test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCHITECTURE" in arm64) abi=Arm64 ;; universal) abi=Universal ;; *) exit 1 ;; esac
          case "$SERVICE_VARIANT" in foss) service=Foss ;; gms) service=Gms ;; *) exit 1 ;; esac
          case "$BUILD_MODE" in
            production) kind=Release; signing=(-PpippoRequireReleaseSigning=true) ;;
            development) kind=Debug; signing=() ;;
            *) exit 1 ;;
          esac
          chmod +x gradlew
          ./gradlew ":app:assemble${abi}${service}${kind}" ":app:test${abi}${service}${kind}UnitTest" ":app:lint${abi}${service}${kind}" "${signing[@]}" --no-configuration-cache --console=plain
          mkdir -p apk-output
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          mapfile -t apks < <(find "app/build/outputs/apk/${ARCHITECTURE}${service}/${kind,,}" -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Expected exactly one APK'; exit 1; }
          cp "${apks[0]}" "apk-output/Pippo-${version}-${ARCHITECTURE}-${SERVICE_VARIANT}-${BUILD_MODE}.apk"
          printf 'PIPPO_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find apk-output -name '*.apk' -type f)
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging "$apk" > apk-output/APK-INFO.txt
          expected=app.pippo.music
          [[ "$BUILD_MODE" != development ]] || expected=app.pippo.music.debug
          grep -F "package: name='$expected'" apk-output/APK-INFO.txt
          label=Pippo
          [[ "$BUILD_MODE" != development ]] || label="Pippo Dev"
          grep -F "application-label:'$label'" apk-output/APK-INFO.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" > apk-output/SIGNING-CERTIFICATE.txt
          (cd apk-output && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo "### Pippo $PIPPO_VERSION"
            echo "Build: $BUILD_MODE · $ARCHITECTURE · $SERVICE_VARIANT"
            echo "Android package: $expected"
            echo 'Download the APK artifact below this run. This workflow does not publish a GitHub Release.'
            if [[ "$BUILD_MODE" == development ]]; then
              echo 'Development uses the runner debug key. Use production signing for durable in-place updates.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pippo-${{ env.PIPPO_VERSION }}-${{ inputs.architecture }}-${{ inputs.service_variant }}-${{ inputs.build_mode }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pippo-check-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pippo-release.jks"
