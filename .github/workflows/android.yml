name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Universal GMS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
      LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require release signing secrets
        shell: bash
        run: |
          for secret_name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing $secret_name. Add release signing secrets in Pippo Settings > Secrets and variables > Actions. STORE_PASSWORD may also be supplied as KEYSTORE_PASSWORD, matching Veyra."
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and native build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        shell: bash
        run: |
          umask 077
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          keytool -list -keystore app/keystore/release.keystore -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleUniversalGmsRelease \
            --no-daemon --no-configuration-cache --no-parallel --max-workers=2 \
            --console=plain --warning-mode=summary \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pippo-universal-gms-release-signed
          path: app/build/outputs/apk/universalGms/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f app/keystore/release.keystore
