name: Android Checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'fastlane/**', 'assets/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/android-production.yml
    with:
      build_mode: development
      architecture: arm64
      service_variant: foss
    secrets: inherit
